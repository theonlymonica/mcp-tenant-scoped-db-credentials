# The shared agent, run by kagent as a BYO (bring-your-own) agent.
#
# The pod has two containers: the agent, and an Envoy that is its only way out.
# The agent sends plain HTTP to 127.0.0.1:15001; Envoy opens the mTLS
# connection to the gateway with the agent's SVID and accepts only the
# gateway's SPIFFE ID.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tvm-agent
  namespace: agents
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-egress-envoy
  namespace: agents
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 127.0.0.1, port_value: 9901}
    static_resources:
      listeners:
        - name: egress
          address:
            socket_address: {address: 127.0.0.1, port_value: 15001}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress
                    route_config:
                      virtual_hosts:
                        - name: gateway
                          domains: ["*"]
                          routes:
                            - match: {prefix: /mcp}
                              route:
                                cluster: gateway
                                timeout: 60s
                                host_rewrite_literal: mcp-gateway.platform.svc.cluster.local
                            - match: {path: /v1/chat/completions}
                              route:
                                cluster: gateway
                                timeout: 180s
                                host_rewrite_literal: mcp-gateway.platform.svc.cluster.local
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: gateway
          type: STRICT_DNS
          dns_lookup_family: V4_ONLY
          connect_timeout: 5s
          load_assignment:
            cluster_name: gateway
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: mcp-gateway.platform.svc.cluster.local, port_value: 8443}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: mcp-gateway.platform.svc.cluster.local
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: default
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services: [{envoy_grpc: {cluster_name: spire_agent}}]
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher: {exact: spiffe://tvm.local/platform/mcp-gateway}
                  validation_context_sds_secret_config:
                    name: ROOTCA
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services: [{envoy_grpc: {cluster_name: spire_agent}}]
        - name: spire_agent
          type: STATIC
          connect_timeout: 5s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config: {http2_protocol_options: {}}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: {path: /run/spire/sockets/agent.sock}
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: tvm-agent
  namespace: agents
spec:
  type: BYO
  description: A document assistant shared by every tenant.
  byo:
    deployment:
      image: agent:1.0.0
      imagePullPolicy: IfNotPresent
      replicas: 1
      serviceAccountName: tvm-agent
      cmd: python
      args: ["-m", "agent"]
      env:
        - {name: AGENT_MODEL, value: "qwen2.5:7b"}
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumes:
        - name: egress-envoy
          configMap:
            name: agent-egress-envoy
        - name: spire-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
      extraContainers:
        - name: envoy
          image: envoyproxy/envoy:distroless-v1.40.2
          imagePullPolicy: IfNotPresent
          args: ["--config-path", "/etc/envoy/envoy.yaml", "--service-node", "tvm-agent",
                 "--service-cluster", "tvm-agent"]
          volumeMounts:
            - {name: egress-envoy, mountPath: /etc/envoy, readOnly: true}
            - {name: spire-socket, mountPath: /run/spire/sockets, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
