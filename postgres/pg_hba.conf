# Who may log in, to which database, from where. A connection that matches no
# line is refused, so everything not written here is closed:
#
#   * the bootstrap superuser logs in only from inside the pod, over the Unix
#     socket (this is how the install scripts reach it, through kubectl exec);
#   * bao_admin, the role OpenBao creates and drops credentials with, and the
#     per-request credentials (the members of an operation role) log in only
#     to the database tvm, and only over TLS.
#
# `+role` means "a member of role". A new operation role must be added to the
# last line; tenants/check_tenants.py checks it.
# TYPE   DATABASE  USER                             ADDRESS      METHOD
local    all       postgres                                      scram-sha-256
hostssl  tvm       bao_admin                        0.0.0.0/0    scram-sha-256
hostssl  tvm       +op_read,+op_search,+op_append   0.0.0.0/0    scram-sha-256
