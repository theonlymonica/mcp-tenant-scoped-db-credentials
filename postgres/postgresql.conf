listen_addresses = '*'
port = 5432
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = 'scram-sha-256'

ssl = on
ssl_cert_file = '/etc/postgresql/tls/tls.crt'
ssl_key_file = '/etc/postgresql/tls/tls.key'
ssl_min_protocol_version = 'TLSv1.2'

# Each per-request credential is a different role, so the connection log shows
# which request reached the database.
log_connections = 'authentication'
log_disconnections = on
log_line_prefix = '%m [%p] db=%d user=%u '
lc_messages = 'C'
log_timezone = 'UTC'
timezone = 'UTC'
