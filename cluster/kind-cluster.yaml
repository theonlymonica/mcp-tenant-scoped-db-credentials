# A local two-node cluster. The default CNI is disabled because Calico replaces
# it: kindnet does not enforce NetworkPolicy. podSubnet must equal
# CALICO_IPV4POOL_CIDR in calico.yaml, and must not overlap the Docker Desktop
# host address (192.168.65.254) through which the pods reach Ollama.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mcp-tenants
networking:
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
nodes:
  - role: control-plane
  - role: worker
